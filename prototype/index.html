<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var d = document.documentElement, t = 'light', n = 'comfortable';
        try {
          t = localStorage.getItem('plumb.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          n = localStorage.getItem('plumb.density') || 'comfortable';
        } catch (e) {}
        d.setAttribute('data-theme', t);
        d.setAttribute('data-density', n);
      })();
    </script>
    <title>Fleet Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
